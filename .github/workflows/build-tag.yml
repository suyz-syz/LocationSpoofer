name: Build APK from Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'v2.6.13'
        required: true
        default: 'v2.6.13'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 必须把 v2.6.13 这个 tag 强制移动到「已修复签名逻辑」的提交上（见下方说明），
      # 否则 checkout 到旧 tag 仍会用硬编码了作者本地密钥路径的旧代码，云端编译必挂。
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 不要用默认 packages（会装已删除的 tools）
      # 不要在这里手动指定 platforms/build-tools：setup-android 自带的包目录常常滞后，
      # 且 AGP 9.x 要求的 build-tools(≥36) 与 34.0.0 冲突。只做一件事：接受 license，
      # 让 AGP 的 SDK 自动下载机制按 compileSdk=37 自动装好对应 platform + build-tools。
      - name: Setup Android SDK (accept licenses only)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          log-accepted-android-sdk-licenses: true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-${{ inputs.tag }}
          path: |
            app/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
